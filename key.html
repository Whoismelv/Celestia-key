<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CELESTIA &middot; Your Key</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 600px at 50% -10%, #1c0f22 0%, #0a0f1a 55%, #05070d 100%) fixed;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #f4f4f4;
    padding: 24px 12px;
  }
  .card {
    width: min(440px, 92vw);
    background: rgba(13, 20, 34, 0.85);
    border: 1px solid rgba(236, 72, 153, 0.35);
    border-radius: 18px;
    padding: 40px 34px;
    text-align: center;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: rise .55s cubic-bezier(.2,.9,.3,1.2) both;
  }
  @keyframes rise { from { transform: translateY(24px) scale(.96); opacity: 0 } to { transform: none; opacity: 1 } }
  .logo {
    font-size: 26px; font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, #ff96b4, #ec4899 55%, #db2777);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { font-size: 11px; letter-spacing: 4px; color: #90a0bf; margin-top: 4px; text-transform: uppercase; }
  .icon-wrap { width: 84px; height: 84px; margin: 26px auto 18px; position: relative; }
  .ring {
    position: absolute; inset: 0; border-radius: 50%;
    border: 3px solid rgba(236,72,153,.25);
    border-top-color: #ec4899;
    animation: spin 1s linear infinite;
  }
  .ring.done { animation: none; border: 3px solid #3dbb4a; }
  .ring.err { animation: none; border: 3px solid #d94141; }
  .check {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    font-size: 34px; color: #3dbb4a; opacity: 0; transform: scale(.4);
    transition: all .35s cubic-bezier(.2,.9,.3,1.4);
  }
  .check.show { opacity: 1; transform: scale(1); }
  @keyframes spin { to { transform: rotate(360deg) } }
  h1 { font-size: 18px; font-weight: 700; }
  .status { margin-top: 10px; font-size: 13px; color: #a6b4cf; line-height: 1.6; }
  .status b { color: #ff96b4; font-weight: 600; }
  .key-box {
    margin: 24px auto 0;
    padding: 18px 16px;
    background: rgba(4, 10, 18, 0.75);
    border: 1px dashed rgba(236, 72, 153, 0.55);
    border-radius: 12px;
    font-family: "Cascadia Code", Consolas, monospace;
    font-size: 24px;
    letter-spacing: 3px;
    color: #ff96b4;
    user-select: all;
    word-break: break-all;
    line-height: 1.5;
  }
  .copy-btn {
    margin-top: 16px;
    padding: 13px 0;
    width: 100%;
    border: 0;
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 1px;
    color: #fff;
    background: linear-gradient(90deg, #db2777, #ec4899);
    transition: transform .12s ease, filter .2s ease;
  }
  .copy-btn:hover { filter: brightness(1.1); }
  .copy-btn:active { transform: scale(.97); }
  .copy-btn.copied { background: linear-gradient(90deg, #2f9e44, #3dbb4a); }
  .expiry { margin-top: 18px; font-size: 12px; color: #90a0bf; }
  .expiry b { color: #ffd166; }
  .foot { margin-top: 22px; font-size: 10px; color: #5b6b8c; letter-spacing: 1px; }
  .err { color: #d94141; font-size: 13px; margin-top: 12px; line-height: 1.6; }
  .hidden { display: none; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(236,72,153,.3); border-top-color: #ec4899; border-radius: 50%; vertical-align: -2px; margin-right: 8px; animation: spin .8s linear infinite; }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">CELESTIA</div>
    <div class="sub">Premium Script Hub</div>

    <div class="icon-wrap">
      <div class="ring" id="ring"></div>
      <div class="check" id="check">&#10003;</div>
    </div>

    <h1 id="title">PREPARING YOUR KEY...</h1>
    <div class="status" id="status">
      <span class="spinner"></span>Minting a private access key.
    </div>
    <div class="key-box hidden" id="keyBox"></div>
    <button class="copy-btn hidden" id="copyBtn">COPY KEY</button>
    <div class="expiry hidden" id="expiry"></div>
    <div class="err hidden" id="err"></div>
    <div class="foot">CELESTIA STUDIOS &middot; WORK.INK</div>
  </div>

<script>
(function () {
  var SUPABASE_URL = "https://plxfneehxhjqhpxlzmui.supabase.co";
  var FN = SUPABASE_URL + "/functions/v1/verify-session";

  var title = document.getElementById("title");
  var status = document.getElementById("status");
  var ring = document.getElementById("ring");
  var check = document.getElementById("check");
  var keyBox = document.getElementById("keyBox");
  var copyBtn = document.getElementById("copyBtn");
  var expiry = document.getElementById("expiry");
  var errBox = document.getElementById("err");

  // mint only when reached through the shortened link (referrer check)
  var ref = document.referrer || "";
  var viaLink = ref.indexOf("direct-link.net") !== -1 ||
                ref.indexOf("linkvertise") !== -1 ||
                ref.indexOf("loot-link") !== -1 ||
                ref.indexOf("lootlabs") !== -1 ||
                ref.indexOf("work.ink") !== -1 ||
                ref.indexOf("lootlink") !== -1;
  if (!viaLink) {
    ring.classList.add("err");
    title.textContent = "NO KEY AVAILABLE";
    status.textContent = "";
    errBox.textContent = "Open this page from the script link. Direct access is not allowed.";
    errBox.classList.remove("hidden");
    return;
  }

  function showKey(key, expiresAt) {
    ring.classList.remove("err");
    ring.classList.add("done");
    check.classList.add("show");
    title.textContent = "YOUR ACCESS KEY";
    status.innerHTML = "Paste this key into the script, then press <b>REDEEM</b>.";
    keyBox.textContent = key;
    keyBox.classList.remove("hidden");
    copyBtn.classList.remove("hidden");
    var hours = 24;
    if (expiresAt) {
      var diff = new Date(expiresAt).getTime() - Date.now();
      if (diff > 0) hours = Math.max(1, Math.round(diff / 3600000));
    }
    expiry.innerHTML = "Valid for <b>~" + hours + " hours</b> &middot; one-time use";
    expiry.classList.remove("hidden");
  }

  function fail(msg) {
    ring.classList.remove("done");
    ring.classList.add("err");
    title.textContent = "NO KEY AVAILABLE";
    status.textContent = "";
    errBox.textContent = msg;
    errBox.classList.remove("hidden");
  }

  function post(body) {
    body.build = "v3";
    return fetch(FN, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) { return r.json(); });
  }

  post({ action: "current" }).then(function (cur) {
    if (!cur || cur.ok !== true || !cur.session_id) {
      throw new Error("Open this link from the script first.");
    }
    // retry while inside the server-side link-countdown window
    function tryGen(attempt) {
      return post({ action: "genkey", session_id: cur.session_id }).then(function (g) {
        if (g && g.ok === true && g.key) return g;
        if (g && g.err === "early" && attempt < 10) {
          return new Promise(function (res) { setTimeout(res, 4000); }).then(function () {
            return tryGen(attempt + 1);
          });
        }
        throw new Error((g && g.err) || "Key generation failed.");
      });
    }
    return tryGen(0).then(function (g) {
      showKey(g.key, g.expires_at);
    });
  }).catch(function (e) {
    fail((e && e.message) || "Could not generate a key. Re-open the link from the script.");
  });

  copyBtn.addEventListener("click", function () {
    var txt = keyBox.textContent;
    var done = false;
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(function () { done = true; });
    }
    if (!done) {
      var ta = document.createElement("textarea");
      ta.value = txt;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }
    copyBtn.textContent = "COPIED!";
    copyBtn.classList.add("copied");
    setTimeout(function () {
      copyBtn.textContent = "COPY KEY";
      copyBtn.classList.remove("copied");
    }, 1600);
  });
})();
</script>
</body>
</html>
